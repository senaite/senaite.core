name: build and test senaite.core
on:
  - push
  - pull_request
env:
  PLONE_VERSION: "5.2"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pyenv Python builds
        uses: actions/cache@v4
        with:
          path: ~/.pyenv
          key: pyenv-2.7.18-${{ runner.os }}
          restore-keys: |
            pyenv-2.7.18-

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y make build-essential libssl-dev \
              zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev \
              wget curl llvm libncurses5-dev xz-utils tk-dev libxml2-dev \
              libxmlsec1-dev libffi-dev liblzma-dev

      - name: Install pyenv
        run: |
          if [ ! -d "$HOME/.pyenv" ]; then
            curl https://pyenv.run | bash
          fi

      - name: Install Python 2.7 with pyenv (if not cached)
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init --path)"
          pyenv install 2.7.18 || true  # Avoid reinstalling if already cached
          pyenv global 2.7.18

      - name: Verify Python Version
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init --path)"
          python --version  # Should output Python 2.7.18

      - name: Cache eggs
        uses: actions/cache@v4
        with:
          key: eggs-cache-${{ hashFiles('buildout.cfg', 'requirements.txt') }}
          path: |
            eggs/

      - name: Install dependencies and setup virtualenv
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init --path)"
          pip install virtualenv
          virtualenv -p `which python` .
          ./bin/pip install --upgrade pip
          ./bin/pip install -r requirements.txt
          ./bin/buildout -N -t 3 annotate
          ./bin/buildout -N -t 3

      - name: Lint
        run: |
          ./bin/pip install flake8
          ./bin/flake8 --config ci_flake8.cfg src/bika/
          ./bin/flake8 --config ci_flake8.cfg src/senaite/

      - name: Run tests
        run: |
          ./bin/test -s senaite.core.tests

  build-javascript:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # sass-loader requires Node >= 22.11
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: webpack/yarn.lock

      # Fails when yarn.lock and package.json have drifted apart
      - name: Install dependencies
        working-directory: webpack
        run: yarn install --frozen-lockfile

      - name: Build bundles
        working-directory: webpack
        run: yarn build

      # A production build that carries development artifacts still compiles,
      # but breaks in the browser. The JSX development runtime is the case we
      # hit: it calls `jsxDEV`, which the production build of React does not
      # export.
      - name: Check bundles for development artifacts
        run: |
          if grep -qE "jsxDEV|jsx-dev-runtime|webpackHotUpdate" \
              src/senaite/core/browser/static/bundles/*.js; then
            echo "Development artifacts found in the production bundles:"
            grep -lE "jsxDEV|jsx-dev-runtime|webpackHotUpdate" \
                src/senaite/core/browser/static/bundles/*.js
            exit 1
          fi

      # Only the bundles are compared, not the vendored copies below
      # `static/modules`. Source maps are excluded as well: the `file` key
      # inside them carries a hash that changes on every run, while the
      # bundles themselves are reproducible.
      - name: Check committed bundles are up to date
        run: |
          changed=$(git status --porcelain -- \
              src/senaite/core/browser/static/bundles ':(exclude)*.map')
          if [ -n "$changed" ]; then
            echo "The committed bundles differ from a fresh build:"
            echo "$changed"
            echo "Run 'yarn build' in webpack/ and commit the result."
            exit 1
          fi
